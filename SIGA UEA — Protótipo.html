const FASES=['Cadastro','Banca','Defesa','Avaliação','Correções','Concluído'];
function nextStep(t){
 const p=P(),dono=has('aluno')&&t.autor.email===p.email,d=t.defesa,r=t.resultado,corr=t.correcoes;
 const pend=corr.filter(c=>['pendente','devolvida'].includes(c.sit)),atend=corr.filter(c=>c.sit==='atendida');
 const quando=d?`${fmtD(d.data).slice(0,5)}, ${d.ini}`:'';
 if(dono){
  if(t.sit==='rascunho')return ['Termine o cadastro e envie para análise. O que você já preencheu está salvo.','TEL05','Continuar cadastro'];
  if(t.sit==='devolvido')return ['A Coordenação devolveu o cadastro. Leia o parecer, corrija e reenvie; o protocolo é mantido.','TEL05','Corrigir cadastro'];
  if(t.sit==='analise')return ['Cadastro em análise pela Coordenação. Você será avisado por e-mail quando houver parecer.',null];
  if(t.sit==='reprovado')return ['Cadastro reprovado. Procure a Coordenação para saber como proceder.',null];
  if(t.concluido)return ['TCC concluído. Seu acesso ao sistema continua por 7 dias após a aprovação oficial.',null];
  if(!d)return ['Cadastro aprovado. O orientador vai compor a banca e agendar a defesa.',null];
  if(d.status==='confirmada')return vigente(t,'banca')?[`Defesa em ${quando}. A banca já recebeu a versão para banca; prepare a apresentação.`,null]:[`Defesa em ${quando}. Envie a versão para banca para que os avaliadores possam ler antes.`,'TEL09','Enviar versão para banca'];
  if(!r)return ['Defesa realizada. Aguarde as avaliações e o resultado.',null];
  if(pend.length)return [`${pend.length} ${pend.length>1?'correções':'correção'} para atender. Próximo prazo: ${fmtD(pend.map(c=>c.prazo).sort()[0])}.`,'TEL14','Ver correções'];
  if(r.valor==='aprovado_correcoes'&&!t.anuencia&&corr.length)return ['Dê a anuência às correções para liberar a Folha de Aprovação.','TEL14','Dar anuência'];
  if(!vigente(t,'final'))return ['Envie a versão final do trabalho para concluir o TCC.','TEL09','Enviar versão final'];
  return ['Aguardando o responsável pela turma aprovar as correções.',null];
 }
 const orientDono=has('orientador')&&t.orientador===p.nome,profDono=has('professor')&&inScope(t);
 if(has('coordenacao')&&t.sit==='analise'&&!orientDono&&!profDono)return ['Cadastro aguardando a sua análise.','TEL07','Analisar'];
 if(orientDono||profDono||has('coordenacao')){
  const resp=responsavelAgenda(t),quem=t.curso==='SI'?'o professor da disciplina':'o orientador';
  if(t.sit==='analise')return ['Cadastro em análise pela Coordenação.',has('coordenacao')?'TEL07':null,'Analisar'];
  if(t.sit==='devolvido')return ['Cadastro devolvido ao aluno para correção.',null];
  if(t.sit==='aprovado'&&!d){
   if(!bancaOk(t))return resp?['Banca incompleta: faltam membros obrigatórios.','TEL10','Compor banca']:[`Aguardando ${quem} compor a banca.`,null];
   if(!vigente(t,'banca'))return ['Banca completa. Aguardando o aluno enviar a versão para banca.',null];
   return resp?['Banca completa e versão para banca enviada. Falta agendar a defesa.','TEL11','Agendar defesa']:[`Aguardando ${quem} agendar a defesa.`,null];
  }
  if(d&&d.status==='confirmada'){
   if(!d.pub&&(resp||has('coordenacao')))return [`Defesa em ${quando}. Ainda não está na agenda de apresentações.`,'TEL18','Divulgar na agenda'];
   return [`Defesa em ${quando}.`,null];
  }
  if(d&&d.status==='realizada'&&!r){
   if(orientDono){
    const k=meuKey(t),mine=k&&t.aval[k];
    if(!(mine&&mine.enviada))return ['Defesa realizada. Lance a sua avaliação no instrumento.','TEL12','Avaliar'];
    const f=quemFalta(t);return f.length?[`Faltam as avaliações de ${f.map(x=>x.nome).join(' e ')}.`,null]:['Todas as avaliações foram enviadas. Confirme o resultado da defesa.','TEL12','Confirmar resultado'];
   }
   return ['Defesa realizada. Aguardando as avaliações da banca.',null];
  }
  if(r&&!t.docsDef.ata.length&&(orientDono||profDono||has('coordenacao')))return ['Resultado confirmado. Gere a ata da defesa.','TEL13','Gerar ata'];
  if(atend.length&&canApprove(t))return [`${atend.length} ${atend.length>1?'correções aguardam':'correção aguarda'} a sua aprovação.`,'TEL14','Revisar correções'];
  if(r&&!t.concluido)return ['Resultado confirmado. Aguardando o aluno atender as correções e enviar a versão final.',null];
  if(t.concluido)return ['TCC concluído.',null];
  return null;
 }
 if(has('banca')){
  const b=t.banca.find(x=>x.email===p.email);
  if(b&&d&&d.status==='realizada'&&!r&&!(t.aval[p.email]||{}).enviada)return ['Sua avaliação desta defesa está pendente.','TEL12','Avaliar a defesa'];

  if(b)return ['Você já enviou a sua avaliação.',null];
 }
 return null;
}

function tarefas(){
 const fazer=[],aguarda=[];
 if(has('aluno')&&!S.d.tccs.some(x=>x.autor.email===P().email))fazer.push({to:'TEL05',titulo:'Iniciar o cadastro do seu TCC',ctx:`${CURSOS[P().curso]} · TCC1`,det:'Leva cerca de 10 minutos em 4 passos. Você pode parar e continuar depois: o rascunho fica salvo.',cta:'Iniciar cadastro',urg:1});
 if(has('coordenacao')){const f=S.d.tccs.filter(t=>t.sit==='analise').sort((a,b)=>a.enviadoEm.localeCompare(b.enviadoEm));if(f.length){const d=diffDias(TODAY,f[0].enviadoEm);fazer.push({to:'TEL07',titulo:`Analisar ${f.length} ${f.length>1?'cadastros':'cadastro'} de TCC`,ctx:'Fila da Coordenação',det:`O mais antigo espera há ${d} ${d===1?'dia':'dias'} (${f[0].autor.nome}).`,cta:'Abrir fila',urg:d>=5?2:0})}}
 scope().forEach(t=>{
  const ns=nextStep(t);if(!ns)return;
  if(has('coordenacao')&&t.sit==='analise'&&!(has('orientador')&&t.orientador===P().nome))return;
  const ctx=has('aluno')&&t.autor.email===P().email?esc(t.titulo):`${esc(t.autor.nome)} · ${t.curso} · ${t.etapa}`;
  if(ns[1]){const venc=t.correcoes.some(c=>c.sit==='pendente'&&c.prazo<TODAY);fazer.push({t:t.id,to:ns[1],titulo:ns[2],ctx,det:ns[0],cta:ns[2],urg:t.sit==='devolvido'||venc?2:(t.defesa&&t.defesa.status==='confirmada'&&diffDias(t.defesa.data,TODAY)<=7?1:0)})}
  else if(t.sit!=='concluido')aguarda.push({t:t.id,ctx,txt:ns[0]});
 });
 if(has('aluno'))scope().filter(t=>t.autor.email===P().email).forEach(t=>t.tarefas.filter(x=>!x.feito).forEach(x=>{const d=diffDias(x.prazo,TODAY);fazer.push({t:t.id,to:'TEL06',titulo:x.titulo,ctx:'Atividade · prazo '+fmtD(x.prazo),det:x.desc||'Registre a entrega no seu TCC.',cta:'Abrir atividade',urg:d<0?2:d<=7?1:0})}));
 fazer.sort((a,b)=>b.urg-a.urg);
 return {fazer,aguarda};
}

const notaCrit=(c,n,k)=>{const cc=conc(c&&c[k]);if(!cc)return null;const x=n&&n[k];return x!=null&&x!==''&&!isNaN(+x)?+x:meioConc(c[k])};
const notaDe=(c,n)=>{if(!c||INSTR.criterios.some(k=>!c[k.id]))return null;return Math.round(INSTR.criterios.reduce((s,k)=>s+notaCrit(c,n,k.id)*k.peso/100,0)*100)/100};
const fmtI=x=>String(x).replace('.',',');
const notaParcial=v=>INSTR.criterios.reduce((a,k)=>a+(v.c[k.id]?notaCrit(v.c,v.n,k.id)*k.peso/100:0),0);
const meuKey=t=>{const p=P();const b=t.banca.find(x=>(x.papel==='avaliador'||x.papel==='orientador')&&(x.email===p.email||(has('orientador')&&x.papel==='orientador'&&x.nome===p.nome)));return b?(b.email||b.nome):null};
function quemFalta(t){return pessoaAval(t).filter(p=>!(t.aval[p.key]||{}).enviada)}
function regraExcecao(t){
 if(t.mod!=='artigo')return {ap:false,why:'Não se aplica: a modalidade é monografia.'};
 const u=t.pub[t.pub.length-1];
 if(u&&['aceito','publicado'].includes(u.sit)&&/^[AB]/i.test(u.qualis||''))return {ap:true,why:`Artigo ${EDIT[u.sit][1].toLowerCase()} em veículo Qualis ${esc(u.qualis)}: a nota final é o maior valor entre 6,00 e a média.`};
 return {ap:false,why:'Não aplicada: o artigo não está aceito ou publicado em veículo Qualis A ou B.'};
}
function consolidar(t){
 const ns=pessoaAval(t).map(p=>notaDe((t.aval[p.key]||{}).c,(t.aval[p.key]||{}).n));if(ns.some(n=>n==null))return null;
 const media=ns.reduce((a,b)=>a+b,0)/ns.length;const ex=regraExcecao(t);
 return {media,notaFinal:ex.ap?Math.max(6,media):media,ex};
}

 if(t.defesa.status!=='realizada')h+=alertH('info','A defesa ainda não foi realizada','As avaliações são lançadas depois da defesa.');

    ${cc?`<div class="notabox"><label for="nn-${k.id}"><b>Defina a nota</b> dentro do conceito ${cc[1]} (${fmtI(cc[2])} a ${fmtI(cc[3])})</label><div class="nrow"><input type="range" id="nr-${k.id}" min="${cc[2]}" max="${cc[3]}" step="0.1" value="${nv??meioConc(cs)}" data-live="t12n" data-k="${k.id}" data-bind="v.t12.n.${k.id}" aria-label="Nota deslizante"><input class="input" type="number" id="nn-${k.id}" min="${cc[2]}" max="${cc[3]}" step="0.1" inputmode="decimal" value="${nv??meioConc(cs)}" data-live="t12n" data-k="${k.id}" data-bind="v.t12.n.${k.id}" ${e&&e['nn-'+k.id]?'aria-invalid="true"':''}></div>${e&&e['nn-'+k.id]?`<div class="err">${ic('alert')}<span>${esc(e['nn-'+k.id])}</span></div>`:''}<div class="help" id="ctr-${k.id}" aria-live="polite">${fmtN(notaCrit(v.c,v.n,k.id))} × ${k.peso}% = <b>${fmtN(notaCrit(v.c,v.n,k.id)*k.peso/100)}</b> na nota final</div></div>`:`<p class="help">Escolha um conceito; depois você define a nota dentro do intervalo dele.</p>`}`;

   h+=`<section class="card" aria-labelledby="mv"><div class="hd"><span class="eyebrow" id="mv">Minha avaliação</span>${bd('neutral','Instrumento v'+INSTR.versao)}</div>${stp}<form data-submit="t12_next" novalidate>${body}
   <div class="actions"><span class="help" style="margin:0">${st<=4?'Critério '+st+' de 4 · ':''}Nota parcial: <b id="par12">${fmtN(notaParcial(v))}</b></span><span class="row">${st>1?btn('t12_back','Voltar',{k:'ghost',i:'back'}):''}${st===6?btn('t12_rasc','Salvar rascunho',{k:'ghost'})+btn('t12_enviar','Enviar avaliação',{k:'primary',i:'send'}):`<button type="submit" class="btn btn-primary">Continuar${ic('chev')}</button>`}</span></div></form></section>`;

function checkConclude(t){

const TOK=[['--bg','Fundo da aplicação'],['--surface','Cartões, campos e superfícies elevadas'],['--surface-2','Áreas de apoio e linhas de tabela'],['--ink','Texto principal (contraste ≥ 7:1)'],['--muted','Texto secundário (≥ 4,5:1)'],['--line','Bordas e divisores'],['--primary','Marca: ações primárias, foco de navegação'],['--ok','Sucesso, concluído, atendido'],['--warn','Atenção, pendente, prazo próximo'],['--danger','Erro, perigo, ação destrutiva'],['--info','Informativo, em andamento'],['--proto','Só controles do protótipo (fora do produto)']];
function sysTab(){
 return `<h3>Paleta (tokens)</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">${TOK.map(([k,d])=>`<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.75rem"><div style="height:34px;background:var(${k})"></div><div style="padding:5px 7px"><b class="mono">${k}</b><div class="muted">${d}</div></div></div>`).join('')}</div>
 <h3>Regras de cor</h3><div class="hh o"><b>1.4.1</b>Cor nunca é o único canal: todo selo tem ícone + texto. Pares de texto/fundo ≥ 4,5:1 nos dois temas.</div>
 <h3>Tipografia</h3><div class="hh o"><b>UI</b>Public Sans 400/500/600/700 — legível em telas pequenas; corpo 16 px.</div><div class="hh o"><b>Dados</b>IBM Plex Mono — protocolos, matrículas, nomes de arquivo.</div>
 <h3>Componentes e regras de uso</h3>
 <div class="hh o"><b>Botão</b>Um primário por tela/seção; secundário contornado; perigo só para ação destrutiva; mín. 44 px (36 px em linhas de tabela).</div>
 <div class="hh o"><b>Campo</b>Rótulo sempre visível acima; * e "(opcional)"; dica abaixo; erro abaixo com ícone, ligado por aria-describedby.</div>
 <div class="hh o"><b>Selo</b>ícone + texto + cor semântica; mesmo vocabulário em todas as telas.</div>
 <div class="hh o"><b>Alerta</b>info/sucesso/atenção/erro; erro de formulário vira resumo no topo com links para os campos.</div>
 <div class="hh o"><b>Diálogo</b>Só para decisões com consequência; título é a pergunta; botão diz a ação; Esc e Cancelar sempre.</div>
 <div class="hh o"><b>Toast + Desfazer</b>Feedback de ações reversíveis (9 s). Também anunciado a leitores de tela.</div>
 <div class="hh o"><b>Tabela</b>Vira cartões abaixo de 700 px, sem rolagem horizontal (RNF04, 360 px).</div>
 <div class="hh o"><b>Estados</b>Todo conteúdo tem padrão, carregando, vazio (explica + próximo passo) e erro (o que houve + tentar de novo).</div>
 <h3>Acessibilidade e responsividade</h3><div class="hh o"><b>WCAG 2.2</b>Foco visível (3 px), alvos ≥ 24 px (usamos 36–44), ordem de foco lógica, link "pular ao conteúdo", prefers-reduced-motion e tema claro/escuro.</div>`;
}
function matrizTab(){

 <h3>Legenda</h3>${hs.map(h=>`<div class="xs"><b class="mono">${h}</b> ${HN[h]}</div>`).join('')}`;
}

function navTab(){
 const sc=SC[S.screen]||{states:[]};
 const logged=!!S.user;
 return `<h3>Quem está usando</h3>${PERSONAS.map(p=>`<button type="button" class="pp" data-act="puser" data-arg="${p.id}" aria-pressed="${S.user===p.id}">${avatarH(p.nome,p.email)}<span><b>${esc(p.nome)}</b><br><span class="xs muted">${esc(p.desc)}</span></span></button>`).join('')}${logged?`<button type="button" class="pp" data-act="puser" data-arg=""><span class="avatar" aria-hidden="true">${ic('back')}</span><span><b>Sair</b><br><span class="xs muted">Voltar à tela de acesso</span></span></button>`:''}
 <h3>Roteiros guiados</h3><p class="xs muted" style="margin:0 0 8px">Siga na ordem. Cada passo troca de pessoa e abre a tela certa; o sistema guarda o que você fez.</p>
 ${ROT.map((r,i)=>`<div class="rot"><b>${esc(r.t)}</b> <span class="tr">${r.fl}</span><div class="xs muted">${esc(r.d)}</div><ol>${r.s.map((s,j)=>`<li>${esc(s[0])} <button type="button" class="btn btn-sec btn-sm" data-act="rot" data-arg="${i}|${j}">Ir</button></li>`).join('')}</ol></div>`).join('')}
 <h3>Estados da tela atual <span class="tr">${S.screen}</span></h3>
 <div class="pchips">${sc.states.map(([k,l])=>`<button type="button" class="pchip" data-act="pstate" data-arg="${k}" aria-pressed="${fs(S.screen)===k}">${esc(l)}</button>`).join('')}</div>
 <h3>Opções</h3>
 <label class="row sm" style="gap:8px"><span>Tema</span><select data-chg="theme" aria-label="Tema">${[['auto','Automático'],['light','Claro'],['dark','Escuro']].map(([k,l])=>`<option value="${k}" ${S.theme===k?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="row sm" style="gap:8px;margin-top:8px"><input type="checkbox" data-chg="trace" ${S.trace?'checked':''}> Mostrar rastreabilidade (TEL, UC, FL) nos títulos</label>
 <div style="margin-top:12px">${btn('reset','Reiniciar dados do protótipo',{k:'sec',sm:true})}</div>`;
}
A.rot=a=>{
 const [i,j]=a.split('|').map(Number),s=ROT[i].s[j];
 if(S.user!==s[1])doLogin(s[1]);
 if(s[3])S.tcc=s[3];

};
function renderDrawer(){
 const el=$('#drawer'),fab=$('#fab');el.classList.toggle('open',S.panel);fab.hidden=S.panel;
 if(!S.panel){el.innerHTML='';return}
 const id=S.screen,d=DOCS[id],s=SC[id],tab=S.ptab;
 let body='';
 if(tab==='nav')body=navTab();
 else if(tab==='tela'){
  body=d?`<h3>${id} · ${esc(s.n)}</h3><div class="row" style="margin-bottom:6px"><span class="tr">${s.uc}</span><span class="tr">${s.fl}</span></div><div class="xs muted">Diagrama de sequência: ${esc(d.ds)}</div>
  <h3>Requisitos</h3><div class="row">${d.req.map(r=>`<span class="tr">${esc(r)}</span>`).join('')}</div>
  <h3>Heurísticas de Nielsen aplicadas</h3>${d.h.map(([k,t])=>`<div class="hh"><b>${k}</b><span class="xs muted">${HN[k]}</span><div style="margin-top:3px">${esc(t)}</div></div>`).join('')}
  <h3>Outros princípios da literatura</h3>${d.o.map(([k,t])=>`<div class="hh o"><b>${esc(k)}</b>${esc(t)}</div>`).join('')}
  <h3>Premissas e pontos em aberto</h3><ul class="sm" style="padding-left:18px;margin:0">${d.pre.map(x=>`<li style="margin-bottom:4px">${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">Sem notas para esta tela.</p>';
 }else if(tab==='sistema')body=sysTab();else body=matrizTab();
 el.innerHTML=`<div class="ph"><b style="flex:1">Protótipo · SIGA UEA</b><button type="button" class="btn btn-ghost btn-sm" data-act="drawer" aria-label="Fechar painel">${ic('close')}</button></div>
 <div class="tabs" role="tablist" style="padding:0 8px;margin:0">${[['nav','Navegar'],['tela','Esta tela'],['sistema','Sistema'],['matriz','Matriz']].map(([k,l])=>`<button type="button" role="tab" class="tab" aria-selected="${tab===k}" data-act="ptab" data-arg="${k}">${l}</button>`).join('')}</div><div class="pbd">${body}</div>`;
}
A.ptab=k=>{S.ptab=k;render()};
/* arrastar e soltar (TEL09) */
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-dz]');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-dz]');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-dz]');if(z){e.preventDefault();z.classList.remove('over');const fl=e.dataTransfer.files[0];if(fl)t09Set(fl.name,fl.size/1048576,fl.type)}});
/* início */
S.v.auth={view:'login',email:'',senha:''};
render();
</script>
