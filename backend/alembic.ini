# Migrações do banco (Alembic). O endereço do banco vem de DATABASE_URL
# (ver app/config.py), não deste arquivo.
#
#   alembic upgrade head                  aplica as migrações pendentes
#   alembic revision --autogenerate -m "o que mudou"   cria uma migração nova
#   alembic upgrade head --sql            mostra o SQL sem executar

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
